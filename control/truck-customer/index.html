<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'self' about:; base-uri 'none'; form-action 'none'"><title>M&M 상용트럭 운송 조회</title><link rel="stylesheet" href="view.css"><style>body{margin:0;background:#f2f5fa}header{background:#18304a;color:white;padding:24px 5%}header h1{font-size:28px;margin:0}main{max-width:1600px;margin:24px auto;padding:0 24px}button{cursor:pointer}#link{width:min(450px,65vw)}details summary{cursor:pointer}#status{font-weight:600}@media print{header,.truck-no-print{display:none}main{padding:0;margin:0;max-width:none}.truck-section{border:0;padding:0}}</style></head>
<body class="truck-report"><header><h1>M&M 상용트럭 운송 조회</h1><p>고객 전용 · 읽기 전용</p></header><main>
<section class="truck-section"><h2 id="title">상용트럭 운송 현황</h2><p id="status" role="status">연결 확인 중…</p><details class="truck-no-print"><summary>전달받은 링크로 조회</summary><div class="truck-controls"><label>전달받은 링크<input id="link" type="password" autocomplete="off"></label><button id="open">링크 조회</button></div></details>
<div class="truck-controls truck-no-print"><label>브랜드<select id="brand"><option value="">전체 브랜드</option><option>Mercedes-Benz</option><option>Volvo</option></select></label><label>현재 단계<select id="stage"></select></label><label>입항예정 시작일<input type="date" id="from"></label><label>입항예정 종료일<input type="date" id="to"></label><label>VIN·B/L·계약·차종·구간 검색<input type="search" id="q"></label><button id="clear">조건 초기화</button><button id="refresh" class="primary">조회</button><button id="print" disabled>조회 목록 인쇄 / PDF</button></div><p class="truck-muted">날짜는 입항예정일 기준입니다. 날짜 조건을 지정하면 예정일 미입력 차량은 제외됩니다. 조건을 초기화하면 허용 차량 전체를 확인할 수 있습니다.</p></section>
<section id="dashboard" aria-label="단계별 운송 대시보드"></section><section class="truck-section"><h2>차량별 진행 목록</h2><p id="result" role="status"></p><div id="data"></div></section><p class="truck-muted">지정된 고객·브랜드·차량만 조회합니다. 신규 차량은 운영자가 별도로 선택해 안내합니다. 링크가 만료되거나 해제되면 새 조회가 종료됩니다.</p>
</main><script type="module" src="portal.js?v=20261108-truck-dashboard"></script></body></html>
