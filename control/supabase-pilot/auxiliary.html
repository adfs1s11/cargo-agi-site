<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>M&M 상용트럭·고객 링크 이전</title><link rel="stylesheet" href="pilot.css"></head><body><header><h1>상용트럭·고객 링크 이전</h1><p>기존 주소·만료·회수 설정 보존 · 관리자 전용</p></header><main>
<section class="card"><h2>1. 기존 원본 연결</h2><p>기존 배차판 공용 아이디입니다. 이메일 계정이 아닙니다.</p><form id="source-login"><label>기존 공용 아이디<input name="username" autocomplete="username" required></label><label>기존 공용 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>원본 연결 확인</button></form><p id="source-status"></p></section>
<section class="card"><h2>2. 새 DB 관리자 확인</h2><p>회사에서 지정한 개인 관리자 이메일입니다. Supabase 가입용 Gmail 계정과 다릅니다.</p><form id="admin-login"><label>관리자 이메일<input name="email" type="email" autocomplete="username" required></label><label>개인 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>관리자 확인</button></form><p id="admin-status"></p></section>
<section class="card"><h2>3. 별도 원장 대조·이전</h2><p>상용트럭과 기존 고객 링크를 Supabase의 비공개 이전 영역에 보관합니다. 이 단계만으로 운영 화면이 전환되지는 않습니다.</p><button id="check" disabled>최신 자료 대조</button> <button id="upload" disabled>확인한 자료 비공개 이전</button><p id="status" role="status"></p><p id="error" role="alert"></p></section>
</main><script type="module" src="auxiliary.js"></script></body></html>
