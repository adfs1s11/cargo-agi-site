<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://wlrtwatqcspdroraeuni.supabase.co; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>M&M 직원 계정 관리</title><link rel="stylesheet" href="pilot.css"></head><body><header><h1>M&M 직원 계정 관리</h1><p>이메일 초대 · 5가지 권한 · 사용 중지 · 변경 이력 보존</p></header><main><p><a href="/control/">전체 운영 메뉴로 이동</a></p><aside>관리자 전용입니다. 초대받은 직원이 이메일에서 본인 비밀번호를 설정합니다. 초대 수락 후 통합 관제 화면에서 개인 이메일로 로그인하세요.</aside><section id="login-box"><h2>관리자 로그인</h2><form id="login"><label>회사 이메일<input name="email" type="email" autocomplete="username" required></label><label>개인 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section id="work" hidden><button id="refresh">목록 새로고침</button><button id="logout">로그아웃</button><h2>직원 초대</h2><form id="invite"><label>직원 이름<input name="name" maxlength="100" required></label><label>직원 이메일<input name="email" type="email" maxlength="254" required></label><label>권한<select name="role" required><option value="">선택하세요</option><option value="admin">관리자</option><option value="executive">경영진</option><option value="dispatch">배차 담당</option><option value="safety">차량·안전 담당</option><option value="settlement">정산 담당</option></select></label><button>초대 메일 발송</button></form><h2>직원 목록</h2><p>계정 삭제 대신 사용 중지로 기록을 보존합니다. 마지막 관리자는 사용 중지하거나 권한을 낮출 수 없습니다.</p><div class="scroll"><table><thead><tr><th>이름 / 이메일</th><th>권한</th><th>사용 상태</th><th>적용</th></tr></thead><tbody id="members"></tbody></table></div><h2>초대 내역</h2><div class="scroll"><table><thead><tr><th>이름 / 이메일</th><th>권한</th><th>처리 상태</th></tr></thead><tbody id="invitations"></tbody></table></div></section><p id="status" role="status"></p><p id="error" role="alert" class="error"></p></main><script type="module" src="staff.js"></script></body></html>
